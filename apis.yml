name: Arivihan
description: 'Arivihan is an Indian EdTech company operating an AI-based, fully automated online learning
  platform that gives each K-12 school student a personalized "tutor in their pocket." It targets low-
  and middle-income families and students in Tier 2+ cities, delivering interactive, personalized
  lectures and doubt resolution in vernacular languages at roughly 10% of typical coaching fees. Products
  include the DoubtBuzzter mobile app and the tutor-prod / InstantGuru doubt-resolution web platform. The
  company was surfaced as a portfolio company of accel and prosus-ventures. No public API or developer
  surface was found during enrichment; this remains a consumer-facing product profile.'
